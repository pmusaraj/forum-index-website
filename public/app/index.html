<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Browse discussions — Forum Index</title>
    <meta name="description" content="Preview great forum discussions.">
    <meta name="theme-color" content="#f2f3f0" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1c1c1a" media="(prefers-color-scheme: dark)">
    <link rel="icon" type="image/png" href="/assets/icon.png">
    <link rel="stylesheet" href="/app/app.css">
    <script src="/app/vendor/markdown-it.min.js" defer></script>
    <script src="/app/app.js" type="module"></script>
  </head>
  <body>
    <header class="app-header">
      <nav class="app-nav" aria-label="Subjects"><button id="browse" aria-pressed="true">Trending</button><div id="subject-tabs"></div></nav>
      <div class="reader-toolbar" hidden><div class="reader-location"><button id="reader-back" aria-label="Back" title="Back"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg></button><span id="reader-forum"></span></div><a id="reader-original" target="_blank" rel="noopener noreferrer">Open on forum ↗</a></div>
    </header>
    <main>
      <h1 class="sr-only">Forum Index discussions</h1>
      <h2 id="heading" class="sr-only">Trending</h2>
      <p id="taxonomy-status" class="muted" role="status"></p>
      <p id="status" role="status" aria-live="polite">Loading discussions…</p>
      <button id="retry" hidden>Try again</button>
      <div id="topics" aria-label="Discussions"></div>
      <noscript><p>Enable JavaScript to browse discussions.</p></noscript>
    </main>
    <section id="reader" hidden aria-label="Discussion reader">
      <h2 id="reader-title" tabindex="-1"></h2>
      <p id="reader-status" role="status">Loading discussion…</p>
      <article id="reader-body"></article>
    </section>
    <aside class="preview-limit" aria-label="Preview limitations"><p>This is a preview of the app to showcase some of the features. Install the app for the full feature set.</p></aside>
  </body>
</html>
